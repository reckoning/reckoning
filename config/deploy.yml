# Kamal deploy configuration for Reckoning
# https://kamal-deploy.org/docs/configuration/
#
# Deploy with: kamal deploy -d live
#
# Secrets are resolved from the Reckoning 1Password vault via .kamal/secrets-common
# and .kamal/secrets.<destination>. Servers and accessories are provisioned by
# https://github.com/reckoning/infrastructure.

service: reckoning
image: reckoning/app

deploy_timeout: 120

servers:
  web:
    options:
      memory: 2g
  worker:
    cmd: bundle exec sidekiq -C config/sidekiq.yml
    options:
      memory: 1g

proxy:
  ssl: true
  forward_headers: true
  app_port: 8240
  healthcheck:
    interval: 5
    timeout: 10
    path: /up

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  args:
    GIT_REVISION: <%= `git rev-parse HEAD`.strip %>
  secrets:
    - RAILS_MASTER_KEY

ssh:
  user: kamal

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "1"
    RAILS_SERVE_STATIC_FILES: "true"
    WORKER_COUNT: "2"
    MAX_THREADS: "5"
    MIN_THREADS: "5"
    PORT: "8240"
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - REDIS_URL
