---
openapi: 3.1.0
info:
  title: Reckoning API
  version: v1
  license:
    name: GNU General Public License v3.0
    url: https://github.com/mortik/reckoning/blob/main/LICENSE
paths:
  "/account":
    get:
      summary: The signed-in user's account
      tags:
      - Account
      operationId: account
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
    patch:
      summary: Update account settings
      tags:
      - Account
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AccountInput"
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/customers":
    get:
      summary: Customers list
      tags:
      - Customers
      operationId: customers
      parameters:
      - "$ref": "#/components/parameters/PageParameter"
      - "$ref": "#/components/parameters/PerPageParameter"
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Customers"
          headers:
            Link:
              description: 'RFC 8288 pagination links: self, first, prev, next, last.'
              schema:
                type: string
        '400':
          description: bad request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
    post:
      summary: Create new Customer
      tags:
      - Customers
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CustomerInput"
      responses:
        '201':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Customer"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/customers/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    get:
      summary: Get Customer
      tags:
      - Customers
      operationId: customer
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Customer"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
    patch:
      summary: Update Customer
      tags:
      - Customers
      operationId: updateCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CustomerInput"
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Customer"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
    delete:
      summary: Destroy Customer
      tags:
      - Customers
      operationId: destroyCustomer
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/me":
    get:
      summary: Signed-in user's own record
      tags:
      - Me
      operationId: me
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CurrentUser"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
    patch:
      summary: Update the signed-in user's profile
      tags:
      - Me
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MeInput"
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CurrentUser"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/me/otp":
    post:
      summary: Begin two-factor enrollment
      tags:
      - Otp
      operationId: createOtpEnrollment
      responses:
        '201':
          description: secret generated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OtpEnrollment"
        '200':
          description: already enrolled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OtpEnrollment"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/me/otp/backup_codes":
    post:
      summary: Regenerate backup codes
      tags:
      - Otp
      operationId: regenerateOtpBackupCodes
      responses:
        '200':
          description: regenerated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OtpBackupCodes"
        '400':
          description: two-factor not enabled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/me/otp/disable":
    post:
      summary: Turn two-factor off
      tags:
      - Otp
      operationId: disableOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OtpInput"
      responses:
        '200':
          description: disabled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OtpEnrollment"
        '400':
          description: invalid code
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/me/otp/enable":
    post:
      summary: Turn two-factor on
      tags:
      - Otp
      operationId: enableOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OtpInput"
      responses:
        '200':
          description: enabled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OtpBackupCodes"
        '400':
          description: invalid code
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/me/otp/qrcode":
    get:
      summary: Provisioning QR code
      tags:
      - Otp
      operationId: otpQrcode
      responses:
        '200':
          description: successful
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
        '401':
          description: unauthorized
          content:
            image/svg+xml:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/me/password":
    patch:
      summary: Change the signed-in user's password
      tags:
      - Me
      operationId: updateMyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordChangeInput"
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CurrentUser"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/passwords":
    post:
      summary: Request a password reset email
      tags:
      - Passwords
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordResetRequestInput"
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
    put:
      summary: Set a new password using a reset token
      tags:
      - Passwords
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PasswordResetInput"
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
        '400':
          description: invalid or expired token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
  "/projects":
    get:
      summary: Projects list
      tags:
      - Projects
      operationId: projects
      parameters:
      - name: state
        in: query
        required: false
        description: Workflow state to filter by. Defaults to active.
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: '"used" orders by most recently tracked.'
        schema:
          type: string
          enum:
          - used
      - name: withoutIds
        in: query
        required: false
        description: Project ids to exclude.
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Projects"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
    post:
      summary: Create new Project
      tags:
      - Projects
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProjectInput"
      responses:
        '201':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Project"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '403':
          description: customer belongs to another account
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/projects/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    get:
      summary: Get Project
      tags:
      - Projects
      operationId: project
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Project"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
    patch:
      summary: Update Project
      tags:
      - Projects
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProjectInput"
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Project"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
    delete:
      summary: Destroy Project
      tags:
      - Projects
      operationId: destroyProject
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/projects/{id}/archive":
    parameters:
    - name: id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    put:
      summary: Archive Project
      tags:
      - Projects
      operationId: archiveProject
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
        '400':
          description: already archived
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/projects/{id}/unarchive":
    parameters:
    - name: id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    put:
      summary: Unarchive Project
      tags:
      - Projects
      operationId: unarchiveProject
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
        '400':
          description: not archived
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/registrations":
    post:
      summary: 'Sign up: create an account and its first user'
      tags:
      - Registrations
      operationId: createRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegistrationInput"
      responses:
        '201':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Registration"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '403':
          description: registration disabled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/sessions":
    post:
      summary: Exchange credentials for a token
      tags:
      - Sessions
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SessionInput"
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        '400':
          description: invalid credentials
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
    delete:
      summary: Revoke the current token
      tags:
      - Sessions
      operationId: destroySession
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/tasks":
    get:
      summary: Tasks list
      tags:
      - Tasks
      operationId: tasks
      parameters:
      - name: weekDate
        in: query
        required: false
        description: Any date in a week. Restricts the nested timers to that week
          and to the signed-in user.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Tasks"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
    post:
      summary: Create new Task
      tags:
      - Tasks
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TaskInput"
      responses:
        '201':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Task"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/tasks/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    patch:
      summary: Update Task
      tags:
      - Tasks
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TaskUpdateInput"
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Task"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
    delete:
      summary: Destroy Task
      tags:
      - Tasks
      operationId: destroyTask
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
        '400':
          description: has timers
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/timers":
    get:
      summary: Timers list
      tags:
      - Timers
      operationId: timers
      parameters:
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: startDate
        in: query
        required: false
        description: Combined with endDate to filter a range.
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: projectId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: uninvoiced
        in: query
        required: false
        description: Present and non-blank restricts to uninvoiced timers.
        schema:
          type: string
      - name: billable
        in: query
        required: false
        schema:
          type: string
      - name: running
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Timers"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
    post:
      summary: Create new Timer
      tags:
      - Timers
      operationId: createTimer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TimerInput"
      responses:
        '201':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Timer"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
  "/timers/uninvoiced":
    get:
      summary: Timers eligible for an invoice position
      tags:
      - Timers
      operationId: uninvoicedTimers
      parameters:
      - name: projectId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: withoutIds
        in: query
        required: false
        description: Timer ids to exclude — typically those already staged in the
          editor.
        schema:
          type: array
          items:
            type: string
            format: uuid
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Timers"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardError"
        '400':
          "$ref": "#/components/responses/SchemaValidationError"
  "/timers/{id}":
    parameters:
    - name: id
      in: path
      schema:
        type: string
        format: uuid
      required: true
    put:
      summary: Update Timer
      tags:
      - Timers
      operationId: updateTimer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TimerInput"
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Timer"
        '400':
          description: bad request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ValidationError"
        '404':
          description: not found
