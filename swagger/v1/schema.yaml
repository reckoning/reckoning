          type: integer
          minimum: 1
          maximum: 4
      - name: month
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 12
      - name: paid_in_year
        in: query
        required: false
        schema:
          type: integer
      - name: paid_in_quarter
        in: query
        required: false
        schema:
          type: integer
      - name: paid_in_month
