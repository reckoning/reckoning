  "/expenses":
    get:
      summary: Expenses list
      tags:
      - Expenses
      operationId: expenses
      parameters:
      - "$ref": "#/components/parameters/PageParameter"
      - "$ref": "#/components/parameters/PerPageParameter"
      - name: year
        in: query
        required: false
        schema:
          type: integer
      - name: quarter
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 4
      - name: month
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 12
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: query
        in: query
        required: false
        description: Free-text search over description and seller.
        schema:
          type: string
      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
