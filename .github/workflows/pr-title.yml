name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Matches the changelog-sections in release-please-config.json
          # plus a few common-but-non-versioning types.
          types: |
            feat
            fix
            refactor
            chore
            docs
            test
            build
            ci
            perf
            style
            revert
          requireScope: false
