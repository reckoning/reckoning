name: Kamal Deploy

on:
  workflow_dispatch:
    inputs:
      destination:
        description: "Kamal destination to deploy (live)"
        required: true
        type: choice
        options: [live]
        default: live

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build.job.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.destination }}

    env:
      KAMAL_REGISTRY_USERNAME: ${{ github.repository_owner }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: ignore

      - name: kamal deploy -d ${{ inputs.destination }}
        run: |
          bundle exec kamal deploy -d ${{ inputs.destination }} \
            --skip-push \
            --version ${{ github.sha }}
