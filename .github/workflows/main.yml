name: Main

on:
  push:
    branches: ["main"]
    tags-ignore:
      - "*.*"
    paths-ignore:
      - "CHANGELOG.md"
      - "config/version.rb"
      - "package.json"
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  ruby-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 1

  ruby-lint:
    needs: ruby-setup
    uses: ./.github/workflows/ruby-lint.job.yml

  brakeman:
    needs: ruby-setup
    uses: ./.github/workflows/brakeman.job.yml

  ruby-audit:
    needs: ruby-setup
    uses: ./.github/workflows/ruby-audit.job.yml

  ruby-tests:
    needs: ruby-setup
    uses: ./.github/workflows/ruby-tests.job.yml

  seeds:
    needs: ruby-setup
    uses: ./.github/workflows/seeds.job.yml

  e2e-tests:
    needs: [ruby-setup]
    uses: ./.github/workflows/e2e-tests.job.yml
    secrets: inherit

  # Deploy is temporarily disabled while the P0 modernization series settles.
  # Re-enable by removing `false &&` once the live environment has been
  # smoke-tested against the new Ruby 3.4 / Rails 7.2 / PG 17 / Redis 7 stack.
  deploy:
    if: false && github.ref == 'refs/heads/main'
    needs: [ruby-lint, brakeman, ruby-audit, ruby-tests, seeds, e2e-tests]
    uses: ./.github/workflows/deploy.job.yml
    with:
      capEnv: live
      name: Live
      url: https://{{ vars.LIVE_DOMAIN }}
    secrets: inherit
