name: E2E Job

on:
  workflow_call:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble

    env:
      DB_NAME: fleetyards_test
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: root
      DB_PASSWORD: root
      TEST_SEEDS: 1
      RAILS_ENV: test
      WORKER_COUNT: 0
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      # Test-only fallback values so Dependabot/fork PRs (which don't
      # inherit repo secrets) still boot Rails. Production / staging
      # inject real secrets via the deploy environment.
      SECRET_KEY_BASE: ci-secret-key-base-not-used-outside-tests
      DEVISE_SECRET: ci-devise-secret-not-used-outside-tests
      DEVISE_JWT_SECRET: ci-devise-jwt-secret-not-used-outside-tests
      DEVISE_OTP_SECRET: ci-devise-otp-secret-not-used-outside-tests
      # ActiveRecord encryption fallback — devise-two-factor 6.x stores
      # `otp_secret` via `encrypts`. See
      # config/initializers/active_record_encryption.rb.
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ci-ar-encryption-primary-key-not-used-outside-tests
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ci-ar-encryption-deterministic-key-not-used-tests
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ci-ar-encryption-key-derivation-salt-not-used
      VITE_RUBY_MODE: production
      ON_SUBDOMAIN: false
      RAILS_SERVE_STATIC_FILES: 1
      DISABLE_DATABASE_ENVIRONMENT_CHECK: 1
      JOBS: 1
      PORT: 8270
      PLAYWRIGHT_BASE_URL: http://localhost:8270
      NODE_OPTIONS: "--max_old_space_size=4096"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_DB: fleetyards_test
          POSTGRES_PASSWORD: root
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends libyaml-dev libvips-dev
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: ./.github/workflows/js-setup-action
      - run: mkdir -p log && mkdir -p tmp/pids && rm -f tmp/pids/*
      - name: Setup DB
        run: bundle exec rails db:create db:schema:load
      - name: Assets Compile
        run: bundle exec rails assets:precompile
      - name: Prefill DB
        run: bundle exec rails db:seed
      - name: Run e2e Tests
        run: pnpm test:e2e:run
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
