name: E2E Job

on:
  workflow_call:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    env:
      DB_NAME: fleetyards_test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: root
      DB_PASSWORD: root
      TEST_SEEDS: 1
      RAILS_ENV: ci
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      # Test-only fallback values so Dependabot/fork PRs (which don't
      # inherit repo secrets) still boot Rails. Production / staging
      # inject real secrets via the deploy environment.
      SECRET_KEY_BASE: ci-secret-key-base-not-used-outside-tests
      DEVISE_SECRET: ci-devise-secret-not-used-outside-tests
      DEVISE_JWT_SECRET: ci-devise-jwt-secret-not-used-outside-tests
      DEVISE_OTP_SECRET: ci-devise-otp-secret-not-used-outside-tests
      VITE_RUBY_MODE: production
      ON_SUBDOMAIN: false
      RAILS_SERVE_STATIC_FILES: 1
      DISABLE_DATABASE_ENVIRONMENT_CHECK: 1
      JOBS: 1
      PORT: 8270
      PLAYWRIGHT_BASE_URL: http://localhost:8270

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_DB: fleetyards_test
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: ./.github/workflows/js-setup-action
      - run: mkdir -p log && mkdir -p tmp/pids && rm -f tmp/pids/*
      - name: Setup DB
        run: bundle exec rails db:create db:schema:load
      - name: Assets Compile
        run: bundle exec rails assets:precompile
      - name: Prefill DB
        run: bundle exec rails db:seed
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Boot Rails
        run: bundle exec puma -C config/puma.rb &
      - name: Wait for Rails to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf "$PLAYWRIGHT_BASE_URL" > /dev/null; then
              echo "Rails up"
              exit 0
            fi
            sleep 2
          done
          echo "Rails did not boot within 120s"
          exit 1
      - name: Playwright run
        run: pnpm exec playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
