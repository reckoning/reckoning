name: Ruby Lint Job

on:
  workflow_call:

jobs:
  ruby-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 1
      - name: rubocoptering
        run: bundle exec standardrb --format progress
